# PLAN (DMF RA lifecycle): validate the Design, check capacity, preview changes.
#   ansible-playbook playbooks/workload-plan.yml -e workload=news-studio
- name: Plan a Media Workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Hand-written workloads/<id>.yaml, else the compiler's workloads/generated/<id>.yaml.
    workload_file: "{{ lookup('ansible.builtin.pipe', dmf_repo_root ~ '/scripts/workload-file.sh ' ~ (workload | quote)) }}"
  tasks:
    - name: Load workload design
      ansible.builtin.set_fact:
        dmf_workload: "{{ lookup('ansible.builtin.file', workload_file) | from_yaml }}"

    - name: Validate design
      ansible.builtin.assert:
        quiet: true
        that:
          - dmf_workload.kind == 'MediaWorkload'
          - dmf_workload.metadata.name == workload
          - dmf_workload.metadata.name is match('^[a-z0-9]([-a-z0-9]{0,40}[a-z0-9])?$')
          - dmf_workload.spec.mediaExchange.domain is match('^[a-z0-9][-a-z0-9]{0,62}$')
          - dmf_workload.spec.mediaExchange.uid | int >= 10000
          - dmf_workload.spec.mediaExchange.uid == dmf_workload.spec.mediaExchange.gid
          - dmf_workload.spec.mediaExchange.sizeMiB | int >= 256
          - dmf_workload.spec.functions | selectattr('kind', 'equalto', 'switchframe') | list | length == 1
          - dmf_workload.spec.access.hostname is match('^[a-z0-9.-]+$')
        fail_msg: "{{ workload_file }} is not a valid MediaWorkload design"

    # Every check below asks the cluster. Without this, a stopped facility shows up as kubectl's
    # "connection refused" on the first of them.
    - name: Check that the facility is running
      ansible.builtin.command: kubectl --kubeconfig {{ dmf_kubeconfig }} get ns -o name
      register: cluster_up
      changed_when: false
      failed_when: false

    - name: Require a running facility
      ansible.builtin.assert:
        that: cluster_up.rc == 0
        fail_msg: "The facility is not running (Kubernetes doesn't answer). Run: make start NO_BROWSER=1, then plan again."
        quiet: true

    - name: Check that uid/domain/ports are not used by another provisioned workload
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ dmf_kubeconfig }} get ns -l dmf.ebu.ch/workload!={{ workload }},dmf.ebu.ch/workload
        -o jsonpath='{range .items[*]}{.metadata.labels.dmf\.ebu\.ch/uid} {.metadata.labels.dmf\.ebu\.ch/flow-domain}{"\n"}{end}'
      register: others
      changed_when: false

    # QUIC and SRT are published on the node by each workload's LoadBalancer Service.
    - name: List the ports other provisioned workloads publish
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ dmf_kubeconfig }} get svc -A -l dmf.ebu.ch/workload!={{ workload }},dmf.ebu.ch/workload
        -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{range .spec.ports[*]}{.port}{"\n"}{end}{end}'
      register: other_ports
      changed_when: false

    - name: Assert unique workload identity
      ansible.builtin.assert:
        quiet: true
        that:
          - (dmf_workload.spec.mediaExchange.uid | string) not in (others.stdout_lines | map('split', ' ') | map('first') | list)
          - dmf_workload.spec.mediaExchange.domain not in (others.stdout_lines | map('split', ' ') | map('last') | list)
          - (dmf_workload.spec.access.quicPort | string) not in other_ports.stdout_lines
          - (dmf_workload.spec.access.srtPort | default(0) | string) not in other_ports.stdout_lines
        fail_msg: >-
          uid {{ dmf_workload.spec.mediaExchange.uid }}, Flow Domain {{ dmf_workload.spec.mediaExchange.domain }}
          or port {{ dmf_workload.spec.access.quicPort }}/{{ dmf_workload.spec.access.srtPort | default('-') }}
          already used by another workload

    - name: Volume check (live sizes, free disk)
      ansible.builtin.command: "python3 {{ dmf_repo_root }}/ansible/scripts/storage.py {{ workload_file }} {{ dmf_kubeconfig }}"
      register: storage
      changed_when: false
      failed_when: false

    - name: Stop if the volumes can't be provisioned
      ansible.builtin.fail:
        msg: "{{ (storage.stdout | from_json).problems }}"
      when: storage.rc != 0

    - name: Capacity check (reserve without oversubscription)
      ansible.builtin.command: "python3 {{ dmf_repo_root }}/ansible/scripts/capacity.py {{ workload_file }} {{ dmf_kubeconfig }}"
      register: capacity
      changed_when: false
      failed_when: false

    - name: Capacity verdict
      ansible.builtin.debug:
        msg: "{{ capacity.stdout | from_json }}"

    - name: Stop if the workload does not fit
      ansible.builtin.fail:
        msg: "Not enough unreserved capacity for {{ workload }} (see verdict above)."
      when: capacity.rc != 0

    # Terraform copies a workload's secret values (.state/secrets/<id>.yaml, mode 600) into its
    # plan and state files, which it writes world-readable.
    - name: Keep Terraform's state private
      ansible.builtin.file:
        path: "{{ dmf_terraform_dir }}/workload/terraform.tfstate.d"
        state: directory
        mode: "0700"

    # Terraform's Keycloak provider logs in while planning. Straight after k3s starts Keycloak
    # answers 503 for a minute or two, which otherwise fails the plan.
    - name: Wait for Keycloak (Terraform reads users and creates the SSO client in it)
      ansible.builtin.uri:
        url: "https://keycloak.{{ dmf_base_domain | default('dmf.test') }}/realms/master/.well-known/openid-configuration"
        validate_certs: false
      register: keycloak_ready
      retries: 60
      delay: 5
      until: keycloak_ready.status == 200

    - name: Terraform plan
      block:
        - name: Terraform plan in workspace {{ workload }}
          community.general.terraform:
            project_path: "{{ dmf_terraform_dir }}/workload"
            workspace: "{{ workload }}"
            state: planned
            plan_file: "{{ dmf_state_dir }}/{{ workload }}.tfplan"
            force_init: true
            variables:
              workload_file: "{{ workload_file }}"
              kubeconfig: "{{ dmf_kubeconfig }}"
              charts_dir: "{{ dmf_repo_root }}/charts"
              image_tag: "{{ dmf_image_tag }}"
              secrets_file: "{{ dmf_state_dir }}/secrets/{{ workload }}.yaml"
              image_ids_file: "{{ dmf_state_dir }}/image-ids.json"
          register: tfplan
          check_mode: false
      rescue:
        # A name in spec.access.members that Keycloak doesn't know fails data.keycloak_user, with
        # Terraform's whole plan around the error. Say which name, and what to do.
        - name: Name access members that aren't Keycloak users
          vars:
            missing: >-
              {{ (ansible_failed_result.msg | default(''))
                 | regex_findall('keycloak_user[.]member[[].([^]"]+).[]]') | unique }}
          ansible.builtin.fail:
            msg: >-
              Access role member{{ 's' if missing | length > 1 else '' }} {{ missing | join(', ') }}
              {{ 'are not users' if missing | length > 1 else 'is not a user' }} in Keycloak's dmf realm.
              Name an existing user in the design's access roles, in lower case (make platform creates
              the users in its operators variable, by default director1, audio1, graphics1 and viewer1),
              then publish and deploy again.
          when: missing | length > 0

        - name: Terraform plan failed
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('Terraform plan failed') }}"

    - name: Keep the plan file private (it holds the workload's secret values)
      ansible.builtin.file:
        path: "{{ dmf_state_dir }}/{{ workload }}.tfplan"
        mode: "0600"

    - name: Plan summary
      ansible.builtin.debug:
        msg: "{{ tfplan.stdout_lines | select('search', 'Plan:|No changes') | list }}"
