# FINALISE & REVIEW (DMF RA lifecycle): record everything in persistent storage,
# then delete Media Functions, authorisations and reservations, and release
# the Flow Domain shared memory.
#   ansible-playbook playbooks/workload-finalise.yml -e workload=news-studio
- name: Archive and tear down a Media Workload
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    kubectl: "kubectl --kubeconfig {{ dmf_kubeconfig }} -n wl-{{ workload }}"
  tasks:
    # A fact, not a play var: a var is templated again at every use, so its timestamp moved on
    # each second and later tasks wrote into directories that didn't exist (silently, since
    # they ignore failures). That lost news-studio's state on 2026-11-07.
    - name: Fix the archive directory for this run
      ansible.builtin.set_fact:
        archive: "{{ dmf_state_dir }}/archive/{{ workload }}-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

    - name: Resolve the workload file (hand-written, else generated)
      ansible.builtin.set_fact:
        dmf_workload_file: "{{ lookup('ansible.builtin.pipe', dmf_repo_root ~ '/scripts/workload-file.sh ' ~ (workload | quote)) }}"

    - name: Read the workload design
      ansible.builtin.set_fact:
        dmf_workload: "{{ lookup('ansible.builtin.file', dmf_workload_file) | from_yaml }}"
        # Compiled from published XML: workloads/generated/<id>.{yaml,config.json,source.xml}.
        dmf_workload_generated: "{{ dmf_workload_file is search('/workloads/generated/') }}"

    # Archiving and teardown both need the running cluster. Stop here, before
    # creating an archive that would have nothing in it.
    - name: Check that the facility is running
      ansible.builtin.command: "{{ kubectl }} get pods"
      register: cluster_up
      changed_when: false
      failed_when: false

    - name: Require a running facility
      ansible.builtin.assert:
        that: cluster_up.rc == 0
        fail_msg: "The facility is not running, and finalise needs it to archive and tear down. Run: make start NO_BROWSER=1 WORKLOAD={{ workload }}"
        quiet: true

    - name: Wait for Keycloak (Terraform removes the workload's client from it)
      ansible.builtin.uri:
        url: "https://keycloak.{{ dmf_base_domain | default('dmf.test') }}/realms/master/.well-known/openid-configuration"
        validate_certs: false
      register: keycloak_ready
      retries: 60
      delay: 5
      until: keycloak_ready.status == 200

    - name: Create archive directory
      ansible.builtin.file:
        path: "{{ archive }}/logs"
        state: directory
        mode: "0700"

    - name: List pods
      ansible.builtin.command: "{{ kubectl }} get pods -o jsonpath={.items[*].metadata.name}"
      register: pods
      changed_when: false
      failed_when: false

    - name: Archive container logs
      ansible.builtin.shell: "{{ kubectl }} logs {{ item }} --all-containers --timestamps > {{ archive }}/logs/{{ item }}.log 2>&1"
      loop: "{{ pods.stdout.split() }}"
      changed_when: true
      failed_when: false

    - name: Archive SwitchFrame state (presets, macros, operators, SCTE-35 rules, as-run logs)
      ansible.builtin.shell: >-
        {{ kubectl }} exec deploy/{{ (dmf_workload.spec.functions | selectattr('kind', 'equalto', 'switchframe') | first).name }}
        -c switchframe -- tar -C /var/lib/switchframe -czf - . > {{ archive }}/switchframe-state.tgz
      changed_when: true
      failed_when: false

    - name: Archive the design and the Kubernetes resources as deployed
      ansible.builtin.shell: |
        cp {{ dmf_workload_file | quote }} {{ archive }}/design.yaml
        {{ kubectl }} get deploy,svc,ingress,networkpolicy,resourcequota,cm -o yaml > {{ archive }}/resources.yaml
        {{ kubectl }} get events --sort-by=.lastTimestamp > {{ archive }}/events.txt
      changed_when: true
      failed_when: false

    # The published XML and the compiled config: what the toolkit asked for, beside what ran.
    # Unlike the logs above, a missing file here stops the finalise before anything is destroyed.
    - name: Archive the published source and compiled config
      when: dmf_workload_generated | bool
      ansible.builtin.copy:
        src: "{{ dmf_workload_file | dirname }}/{{ item.from }}"
        dest: "{{ archive }}/{{ item.to }}"
        mode: "0600"
      loop:
        - {from: "{{ workload }}.source.xml", to: source.xml}
        - {from: "{{ workload }}.config.json", to: config.json}

    # Recordings live on the workload's local-path volume, which terraform destroy deletes, so they
    # are copied first and the copy is checked file by file (decision D9). A failed or incomplete
    # copy stops the finalise; DISCARD_RECORDINGS=1 (dmf_discard_recordings) is the deliberate override.
    - name: Recordings
      when: mixer_fn.volumes.recordingsGi is defined
      vars:
        mixer_fn: "{{ dmf_workload.spec.functions | selectattr('kind', 'equalto', 'switchframe') | first }}"
        exec: "{{ kubectl }} exec deploy/{{ mixer_fn.name }}"
        discard: "{{ dmf_discard_recordings | default(false) | bool }}"
      block:
        - name: Stop the recording, so its last file is complete (the reconciler leaves a clean stop alone)
          ansible.builtin.command: "{{ exec }} -c reconciler -- python3 -I /usr/local/bin/sf-reconciler stop-recording"
          register: rec_stop
          changed_when: rec_stop.rc == 0
          failed_when: false

        - name: Create the recordings archive directory
          ansible.builtin.file:
            path: "{{ archive }}/recordings"
            state: directory
            mode: "0700"

        - name: Copy /recordings to the archive
          ansible.builtin.shell: |
            set -o pipefail
            {{ exec }} -c switchframe -- tar -C /recordings -cf - . | tar -C {{ (archive ~ '/recordings') | quote }} -xf -
          args:
            executable: /bin/bash
          register: rec_copy
          changed_when: rec_copy.rc == 0
          failed_when: false

        # Name and size of every file, in the volume and in the archive: they must be the same.
        - name: List the recordings in the volume
          ansible.builtin.command: "{{ exec }} -c switchframe -- find /recordings -type f -printf '%P %s\\n'"
          register: rec_source
          changed_when: false
          failed_when: false

        - name: List the recordings in the archive
          ansible.builtin.command:
            argv: [find, "{{ archive }}/recordings", -type, f, -printf, "%P %s\\n"]
          register: rec_archived
          changed_when: false
          failed_when: false

        - name: Stop before teardown if the recordings weren't copied
          ansible.builtin.assert:
            quiet: true
            that:
              - rec_copy.rc == 0
              - rec_source.rc == 0
              - (rec_source.stdout_lines | sort) == (rec_archived.stdout_lines | sort)
            fail_msg: >-
              Copying the recordings to {{ archive }}/recordings failed, so nothing was destroyed
              (copy rc {{ rec_copy.rc }}: {{ rec_copy.stderr | default('') | trim | truncate(300) }};
              {{ rec_source.stdout_lines | length }} files in the volume, {{ rec_archived.stdout_lines | length }} archived).
              Fix the cause and run make finalise again, or run it with DISCARD_RECORDINGS=1 to tear down
              and lose the recordings.
          when: not (discard | bool)

        - name: Recordings discarded
          ansible.builtin.debug:
            msg: >-
              WARNING: DISCARD_RECORDINGS is set: {{ rec_source.stdout_lines | length }} recordings
              ({{ rec_archived.stdout_lines | length }} copied) are deleted with the workload.
          when: discard | bool

    # The archive tasks above ignore failures so that one missing log doesn't block a teardown.
    # These checks stop before anything is destroyed if the archive is missing what matters.
    - name: Inspect the archive
      ansible.builtin.stat:
        path: "{{ archive }}/{{ item }}"
      loop: [design.yaml, resources.yaml, switchframe-state.tgz]
      register: archived

    # A size check alone passes an archive cut off mid-stream, e.g. by a dropped exec.
    - name: Read the SwitchFrame state archive back
      ansible.builtin.command:
        argv: [tar, -tzf, "{{ archive }}/switchframe-state.tgz"]
      register: state_listing
      changed_when: false
      failed_when: false
      when: archived.results[2].stat.exists

    - name: Stop before teardown if the archive is incomplete
      ansible.builtin.assert:
        quiet: true
        that:
          - archived.results[0].stat.exists
          - archived.results[1].stat.exists
          # With pods running, SwitchFrame's state (presets, macros, operators) must be in it.
          - >-
            (pods.stdout | trim == '') or (archived.results[2].stat.exists and archived.results[2].stat.size > 0
            and state_listing.rc == 0)
        fail_msg: >-
          The archive {{ archive }} is incomplete (design, resources or SwitchFrame state missing,
          or the state archive doesn't read back: {{ state_listing.stderr | default('') | trim }}),
          so nothing was destroyed. Fix the cause, or rerun with -e dmf_finalise_without_state=true
          to tear down without SwitchFrame's state.
      when: not (dmf_finalise_without_state | default(false) | bool)

    - name: Terraform destroy in workspace {{ workload }}
      community.general.terraform:
        project_path: "{{ dmf_terraform_dir }}/workload"
        workspace: "{{ workload }}"
        state: absent
        force_init: true
        variables:
          workload_file: "{{ dmf_workload_file }}"
          kubeconfig: "{{ dmf_kubeconfig }}"
          charts_dir: "{{ dmf_repo_root }}/charts"
          image_tag: "{{ dmf_image_tag }}"
          secrets_file: "{{ dmf_state_dir }}/secrets/{{ workload }}.yaml"

    - name: Remove workload hostname from the control node
      ansible.builtin.include_role:
        name: control_node
      vars:
        dmf_hosts_state: absent
        dmf_hostnames: ["{{ dmf_workload.spec.access.hostname }}"]

    - name: Review
      ansible.builtin.debug:
        msg: "Workload {{ workload }} finalised. Review material: {{ archive }}"

- name: Media Exchange - delete Flow Domain
  hosts: dmf_cluster
  become: true
  gather_facts: false
  vars:
    dmf_workload: "{{ hostvars['localhost'].dmf_workload }}"
  roles:
    - role: mxl_domain
      dmf_mxl_state: absent

# Only after the destroy and the Flow Domain deletion succeeded: the allocation and the
# generated files describe a workload that may still be running until then.
- name: Release the workload's allocation
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Release uid and ports in .state/allocations.json
      ansible.builtin.command:
        argv: ["{{ dmf_repo_root }}/.tools/venv/bin/python", -m, tools.dmf_compile, release, "{{ workload }}"]
        chdir: "{{ dmf_repo_root }}"
      register: released
      changed_when: released.stdout is search('^released')

    - name: Remove the generated workload files (archived above)
      when: dmf_workload_generated | bool
      ansible.builtin.file:
        path: "{{ dmf_workload_file | dirname }}/{{ workload }}.{{ item }}"
        state: absent
      loop: [yaml, config.json, source.xml]

    # They hold secret values and are never archived. Deploying the id again needs its secrets set
    # again; compile rule 6 names them. The file module reports paths only, never contents.
    - name: Remove the workload's secrets file and Terraform plan file
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ dmf_state_dir }}/secrets/{{ workload }}.yaml"
        - "{{ dmf_state_dir }}/{{ workload }}.tfplan"
