# Host Platform: patched, hardened, tuned OS for real-time media containers.
- name: Install base packages
  ansible.builtin.apt:
    name: [curl, jq, ca-certificates, apparmor, unattended-upgrades, tar]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable automatic security updates (DMF RA host security, EBU R 160)
  when: dmf_unattended_upgrades | bool
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Kernel tuning for media networking and containers
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-dmf.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.core.rmem_max: "{{ dmf_udp_buffer_bytes }}"
      net.core.wmem_max: "{{ dmf_udp_buffer_bytes }}"
      net.core.rmem_default: 26214400
      net.core.netdev_max_backlog: 250000
      net.ipv4.ip_forward: 1
      fs.inotify.max_user_instances: 8192
      fs.inotify.max_user_watches: 1048576
      vm.swappiness: 10

- name: Raise open-file limits (SwitchFrame needs >= 65536)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-dmf.conf
    mode: "0644"
    content: |
      *    soft nofile {{ dmf_nofile_limit }}
      *    hard nofile {{ dmf_nofile_limit }}

- name: Use the performance CPU governor where cpufreq exists
  when: not dmf_is_wsl
  ansible.builtin.copy:
    dest: /etc/systemd/system/dmf-cpu-performance.service
    mode: "0644"
    content: |
      [Unit]
      Description=DMF: performance CPU governor for real-time media
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do [ -w "$g" ] && echo performance > "$g"; done; true'
      [Install]
      WantedBy=multi-user.target
  notify: Apply CPU governor

- name: Install auditd (access accounting)
  when: not dmf_is_wsl            # the WSL2 kernel has no audit subsystem
  ansible.builtin.apt:
    name: auditd
    state: present

- name: Audit changes to DMF and Kubernetes host configuration
  when: not dmf_is_wsl
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/90-dmf.rules
    mode: "0640"
    content: |
      -w /etc/rancher/ -p wa -k dmf-k8s-config
      -w /var/lib/dmf/ -p wa -k dmf-media-exchange
      -w /etc/linuxptp/ -p wa -k dmf-timing
      -w /etc/sudoers -p wa -k dmf-privilege
  notify: Reload audit rules

- name: Harden SSH (key-only, no root)
  when: ansible_connection | default('ssh') != 'local'
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-dmf.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 3
  notify: Reload sshd
