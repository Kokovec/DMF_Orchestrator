- name: Apply CPU governor
  ansible.builtin.systemd_service:
    name: dmf-cpu-performance.service
    enabled: true
    state: restarted
    daemon_reload: true

- name: Reload audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Reload sshd
  ansible.builtin.service:
    name: ssh
    state: reloaded
