# Kubernetes API audit (DMF RA security: Authorisation and Accounting).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  # Secret payloads never reach the audit log.
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets, configmaps]
  - level: None
    users: ["system:kube-proxy"]
    verbs: [watch]
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version"]
  - level: Request
    verbs: [create, update, patch, delete, deletecollection]
  - level: Metadata
