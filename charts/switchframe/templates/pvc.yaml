{{- if .Values.persistence.enabled }}
# Presets, macros, operators and SCTE-35 rules. Archived during FINALISE.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "switchframe.fullname" . }}-state
  labels:
    {{- include "switchframe.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
