apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchframe.fullname" . }}-flows
  labels:
    {{- include "switchframe.labels" . | nindent 4 }}
data:
  output_video.json: |
    {{- toPrettyJson .Values.mxl.output.videoFlow | nindent 4 }}
  output_audio.json: |
    {{- toPrettyJson .Values.mxl.output.audioFlow | nindent 4 }}
