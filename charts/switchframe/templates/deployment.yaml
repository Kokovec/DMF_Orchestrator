{{- $fullname := include "switchframe.fullname" . -}}
{{- $domain := required "mxl.domainPath is required" .Values.mxl.domainPath -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "switchframe.labels" . | nindent 4 }}
    app.kubernetes.io/component: media-function
spec:
  replicas: 1
  # One writer per MXL output flow and fixed host ports: never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "switchframe.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchframe.labels" . | nindent 8 }}
        app.kubernetes.io/component: media-function
      annotations:
        checksum/flows: {{ include (print $.Template.BasePath "/configmap-flows.yaml") . | sha256sum }}
        dmf.ebu.ch/image-id: {{ .Values.imageId | default "" | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "switchframe.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 20
      # MXL shared memory is host-local: every Media Function of a workload must
      # land on the same host as its Flow Domain peers.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  dmf.ebu.ch/workload: {{ .Values.workload }}
      {{- if gt (int .Values.switchframe.gpu) 0 }}
      runtimeClassName: nvidia
      {{- end }}
      {{- if .Values.mxl.sources }}
      # After a host restart the Flow Domain is empty and every pod starts at
      # once. SwitchFrame skips an input whose flow does not exist yet and never
      # retries it, so wait for the input flows (bounded: one missing input must
      # not keep the mixer off the air).
      initContainers:
        - name: wait-for-input-flows
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "switchframe.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              domain="$1"; shift
              i=0
              for flow in "$@"; do
                until [ -d "$domain/$flow.mxl-flow" ]; do
                  i=$((i + 1))
                  if [ "$i" -ge 120 ]; then echo "timed out waiting for flow $flow"; exit 0; fi
                  sleep 1
                done
              done
            - wait-for-input-flows
            - {{ $domain }}
            {{- range .Values.mxl.sources }}
            - {{ .video }}
            {{- if .audio }}
            - {{ .audio }}
            {{- end }}
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: mxl-domain, mountPath: {{ $domain }}, readOnly: true}
      {{- end }}
      containers:
        - name: switchframe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "switchframe.containerSecurityContext" . | nindent 12 }}
          args:
            - --addr=:{{ .Values.switchframe.quicPort }}
            - --http-fallback
            - --http-addr=:{{ .Values.switchframe.httpPort }}
            - --admin-addr=0.0.0.0:{{ .Values.switchframe.adminPort }}
            {{- if .Values.ingress.hostname }}
            - --allowed-origins=https://{{ .Values.ingress.hostname }}
            {{- end }}
            - --format={{ .Values.switchframe.format }}
            - --log-level={{ .Values.switchframe.logLevel }}
            - --cache-dir=/cache
            - --replay-tmpfs-dir=/replay
            - --mxl-domain={{ $domain }}
            {{- with include "switchframe.mxlSources" . }}
            - --mxl-sources={{ . }}
            {{- end }}
            {{- if .Values.mxl.output.enabled }}
            - --mxl-output={{ .Values.mxl.output.name }}
            - --mxl-output-video-def=/etc/switchframe/flows/output_video.json
            - --mxl-output-audio-def=/etc/switchframe/flows/output_audio.json
            {{- end }}
            {{- if .Values.switchframe.srtPort }}
            - --srt-listen=:{{ .Values.switchframe.srtPort }}
            {{- end }}
            {{- range .Values.switchframe.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: APP_ENV
              value: production          # JSON structured logs
            - name: HOME
              value: /var/lib/switchframe
            - name: SWITCHFRAME_STATE_DIR
              value: /var/lib/switchframe
            - name: GOMEMLIMIT
              value: {{ .Values.switchframe.goMemLimit | quote }}
            - name: SWITCHFRAME_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ required "switchframe.existingSecret is required" .Values.switchframe.existingSecret }}, key: api-token}
            - name: SWITCHFRAME_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.switchframe.existingSecret }}, key: admin-token}
            - name: SWITCHFRAME_INVITE_TOKENS
              valueFrom:
                secretKeyRef: {name: {{ .Values.switchframe.existingSecret }}, key: invite-tokens}
          ports:
            - {name: quic, containerPort: {{ .Values.switchframe.quicPort }}, protocol: UDP}
            - {name: http, containerPort: {{ .Values.switchframe.httpPort }}, protocol: TCP}
            - {name: admin, containerPort: {{ .Values.switchframe.adminPort }}, protocol: TCP}
            {{- if .Values.switchframe.srtPort }}
            - {name: srt, containerPort: {{ .Values.switchframe.srtPort }}, protocol: UDP}
            {{- end }}
          {{- if .Values.configure.programSource }}
          # SwitchFrame forgets its programme source and source labels on every
          # restart, and only publishes programme flows with a source on air.
          # Restore both here so any restart recovers without operator action.
          # Always exits 0: a failed hook would kill the container.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    log() { echo "dmf-configure: $*" > /proc/1/fd/1 2>/dev/null || true; }
                    program="$1"; shift
                    auth="Authorization: Bearer $SWITCHFRAME_API_TOKEN"
                    api=http://127.0.0.1:{{ .Values.switchframe.httpPort }}/api
                    i=0
                    until curl -sf -o /dev/null -H "$auth" "$api/switch/state"; do
                      i=$((i + 1))
                      if [ "$i" -ge 120 ]; then log "API not ready, giving up"; exit 0; fi
                      sleep 1
                    done
                    # Commands need an identified operator once operators exist;
                    # a short-lived, named one also attributes the change.
                    resp=$(curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' \
                      -d "{\"name\":\"dmf-automation-$(date +%s)\",\"role\":\"director\"}" "$api/operator/register") \
                      || { log "operator registration failed"; exit 0; }
                    tok=$(printf '%s' "$resp" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
                    id=$(printf '%s' "$resp" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
                    post() { curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' -d "$2" "$api/$1"; }
                    retry() {
                      n=0
                      until [ "$(post "$1" "$2")" = 200 ]; do
                        n=$((n + 1))
                        if [ "$n" -ge 30 ]; then log "gave up on $1"; return 1; fi
                        sleep 1
                      done
                    }
                    for kv in "$@"; do
                      key=${kv%%=*}; label=${kv#*=}
                      retry "sources/$key/label" "{\"label\":\"$label\"}" && log "$key -> $label"
                    done
                    if curl -sf -H "$auth" "$api/switch/state" | grep -q '"programSource":"[^"]'; then
                      log "programme already on air"
                    else
                      retry switch/cut "{\"source\":\"$program\"}" && log "programme: $program"
                    fi
                    curl -s -o /dev/null -X DELETE -H "Authorization: Bearer $tok" "$api/operator/$id"
                    exit 0
                  - dmf-configure
                  - {{ .Values.configure.programSource | quote }}
                  {{- range .Values.configure.labels }}
                  - {{ printf "%s=%s" .source .label | quote }}
                  {{- end }}
          {{- end }}
          startupProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 5
          resources:
            {{- $res := deepCopy .Values.switchframe.resources }}
            {{- if gt (int .Values.switchframe.gpu) 0 }}
            {{- $_ := set $res.limits "nvidia.com/gpu" .Values.switchframe.gpu }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - {name: mxl-domain, mountPath: {{ $domain }}}
            - {name: flows, mountPath: /etc/switchframe/flows, readOnly: true}
            - {name: state, mountPath: /var/lib/switchframe}
            - {name: cache, mountPath: /cache}
            - {name: replay, mountPath: /replay}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: mxl-domain
          hostPath:
            path: {{ $domain }}
            type: Directory        # must already exist: created by the PROVISION stage
        - name: flows
          configMap:
            name: {{ $fullname }}-flows
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cache
          emptyDir: {}
        - name: replay
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.replayTmpfsSize }}
        - name: tmp
          emptyDir: {}
