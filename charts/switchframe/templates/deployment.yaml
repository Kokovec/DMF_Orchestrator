{{- $fullname := include "switchframe.fullname" . -}}
{{- $domain := required "mxl.domainPath is required" .Values.mxl.domainPath -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "switchframe.labels" . | nindent 4 }}
    app.kubernetes.io/component: media-function
spec:
  replicas: 1
  # One writer per MXL output flow and fixed host ports: never run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "switchframe.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchframe.labels" . | nindent 8 }}
        app.kubernetes.io/component: media-function
      annotations:
        checksum/flows: {{ include (print $.Template.BasePath "/configmap-flows.yaml") . | sha256sum }}
        dmf.ebu.ch/image-id: {{ .Values.imageId | default "" | quote }}
        dmf.ebu.ch/reconciler-image-id: {{ .Values.reconciler.imageId | default "" | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "switchframe.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 20
      # MXL shared memory is host-local: every Media Function of a workload must
      # land on the same host as its Flow Domain peers.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  dmf.ebu.ch/workload: {{ .Values.workload }}
      {{- if gt (int .Values.switchframe.gpu) 0 }}
      runtimeClassName: nvidia
      {{- end }}
      {{- if .Values.mxl.sources }}
      # After a host restart the Flow Domain is empty and every pod starts at
      # once. SwitchFrame skips an input whose flow does not exist yet and never
      # retries it, so wait for the input flows (bounded: one missing input must
      # not keep the mixer off the air).
      initContainers:
        - name: wait-for-input-flows
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "switchframe.containerSecurityContext" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              domain="$1"; shift
              i=0
              for flow in "$@"; do
                until [ -d "$domain/$flow.mxl-flow" ]; do
                  i=$((i + 1))
                  if [ "$i" -ge 120 ]; then echo "timed out waiting for flow $flow"; exit 0; fi
                  sleep 1
                done
              done
            - wait-for-input-flows
            - {{ $domain }}
            {{- range .Values.mxl.sources }}
            - {{ .video }}
            {{- if .audio }}
            - {{ .audio }}
            {{- end }}
            {{- end }}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          volumeMounts:
            - {name: mxl-domain, mountPath: {{ $domain }}, readOnly: true}
      {{- end }}
      containers:
        - name: switchframe
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "switchframe.containerSecurityContext" . | nindent 12 }}
          # Every arg quoted: a value containing ": " or "#" must stay one string.
          args:
            - {{ printf "--addr=:%v" .Values.switchframe.quicPort | quote }}
            - "--http-fallback"
            - {{ printf "--http-addr=:%v" .Values.switchframe.httpPort | quote }}
            - {{ printf "--admin-addr=0.0.0.0:%v" .Values.switchframe.adminPort | quote }}
            {{- if .Values.ingress.hostname }}
            - {{ printf "--allowed-origins=https://%s" .Values.ingress.hostname | quote }}
            {{- end }}
            - {{ printf "--format=%s" .Values.switchframe.format | quote }}
            - {{ printf "--log-level=%s" .Values.switchframe.logLevel | quote }}
            - "--cache-dir=/cache"
            - "--replay-tmpfs-dir=/replay"
            - {{ printf "--mxl-domain=%s" $domain | quote }}
            {{- with include "switchframe.mxlSources" . }}
            - {{ printf "--mxl-sources=%s" . | quote }}
            {{- end }}
            {{- if .Values.mxl.output.enabled }}
            - {{ printf "--mxl-output=%s" .Values.mxl.output.name | quote }}
            - "--mxl-output-video-def=/etc/switchframe/flows/output_video.json"
            - "--mxl-output-audio-def=/etc/switchframe/flows/output_audio.json"
            {{- end }}
            {{- if .Values.switchframe.srtPort }}
            - {{ printf "--srt-listen=:%v" .Values.switchframe.srtPort | quote }}
            {{- end }}
            {{- range .Values.switchframe.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: APP_ENV
              value: production          # JSON structured logs
            - name: HOME
              value: /var/lib/switchframe
            - name: SWITCHFRAME_STATE_DIR
              value: /var/lib/switchframe
            - name: GOMEMLIMIT
              value: {{ .Values.switchframe.goMemLimit | quote }}
            - name: SWITCHFRAME_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ required "switchframe.existingSecret is required" .Values.switchframe.existingSecret }}, key: api-token}
            - name: SWITCHFRAME_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.switchframe.existingSecret }}, key: admin-token}
            - name: SWITCHFRAME_INVITE_TOKENS
              valueFrom:
                secretKeyRef: {name: {{ .Values.switchframe.existingSecret }}, key: invite-tokens}
          ports:
            - {name: quic, containerPort: {{ .Values.switchframe.quicPort }}, protocol: UDP}
            - {name: http, containerPort: {{ .Values.switchframe.httpPort }}, protocol: TCP}
            - {name: admin, containerPort: {{ .Values.switchframe.adminPort }}, protocol: TCP}
            {{- if .Values.switchframe.srtPort }}
            - {name: srt, containerPort: {{ .Values.switchframe.srtPort }}, protocol: UDP}
            {{- end }}
          startupProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: admin}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /ready, port: admin}
            periodSeconds: 5
          resources:
            {{- $res := deepCopy .Values.switchframe.resources }}
            {{- if gt (int .Values.switchframe.gpu) 0 }}
            {{- $_ := set $res.limits "nvidia.com/gpu" .Values.switchframe.gpu }}
            {{- end }}
            {{- toYaml $res | nindent 12 }}
          volumeMounts:
            - {name: mxl-domain, mountPath: {{ $domain }}}
            - {name: flows, mountPath: /etc/switchframe/flows, readOnly: true}
            - {name: state, mountPath: /var/lib/switchframe}
            - {name: cache, mountPath: /cache}
            - {name: replay, mountPath: /replay}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.recordings.size }}
            - {name: recordings, mountPath: /recordings}
            {{- end }}
        # Keeps SwitchFrame at its compiled config (images/media-functions/sf-reconciler): source
        # settings once per appearance, programme on air, destinations and recording, all of which
        # SwitchFrame forgets on restart. Reads the config and secrets from files, which the
        # kubelet updates in place, so a changed config doesn't restart the mixer.
        - name: reconciler
          image: "{{ .Values.reconciler.image.repository }}:{{ .Values.reconciler.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-I", "/usr/local/bin/sf-reconciler"]
          securityContext:
            {{- include "switchframe.containerSecurityContext" . | nindent 12 }}
          env:
            - {name: WORKLOAD, value: {{ .Values.workload | quote }}}
            - {name: SF_API_URL, value: {{ printf "http://127.0.0.1:%v" .Values.switchframe.httpPort | quote }}}
            - {name: CONFIG_FILE, value: /etc/switchframe/config/config.json}
            - {name: SECRETS_DIR, value: /etc/switchframe/secrets}
            - {name: MANAGED_CALLERS_FILE, value: /var/lib/switchframe/dmf-reconciler-callers.json}
            - {name: METRICS_ADDR, value: {{ printf "0.0.0.0:%v" .Values.reconciler.metricsPort | quote }}}
            - name: SWITCHFRAME_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.switchframe.existingSecret }}, key: api-token}
          ports:
            - {name: reconciler, containerPort: {{ .Values.reconciler.metricsPort }}, protocol: TCP}
          resources:
            {{- toYaml .Values.reconciler.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/switchframe/config, readOnly: true}
            - {name: workload-refs, mountPath: /etc/switchframe/secrets, readOnly: true}
            # Its record of the SRT caller pulls it manages must outlive the pod, like the pulls.
            - {name: state, mountPath: /var/lib/switchframe}
      volumes:
        - name: mxl-domain
          hostPath:
            path: {{ $domain }}
            type: Directory        # must already exist: created by the PROVISION stage
        - name: flows
          configMap:
            name: {{ $fullname }}-flows
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: cache
          {{- if .Values.cache.size }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-cache
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: replay
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.replayTmpfsSize }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.recordings.size }}
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ $fullname }}-recordings
        {{- end }}
        - name: config
          configMap:
            name: {{ $fullname }}-config
        # Secret values the config refers to by name (.state/secrets/<id>.yaml, via Terraform).
        - name: workload-refs
          secret:
            secretName: {{ .Values.reconciler.secretName }}
            optional: true
            defaultMode: 0400
