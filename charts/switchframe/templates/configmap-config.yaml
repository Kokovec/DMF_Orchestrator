# The compiled config (tools/dmf_compile; Terraform writes a minimal one for a hand-written
# workload) for the reconciler. Not mounted by the SwitchFrame container, and not in a pod
# annotation: the kubelet updates the file in place, so a change doesn't restart the mixer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchframe.fullname" . }}-config
  labels:
    {{- include "switchframe.labels" . | nindent 4 }}
data:
  config.json: |
    {{- toPrettyJson .Values.config | nindent 4 }}
