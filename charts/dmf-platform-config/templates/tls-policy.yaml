# Traefik applies the TLSOption named "default" to every router: TLS 1.3 only
# (DMF RA: control and monitoring traffic "at least as secure as TLS 1.3").
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: {{ .Values.ingressControllerNamespace }}
spec:
  minVersion: VersionTLS13
  sniStrict: true
