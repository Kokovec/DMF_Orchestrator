{{- if .Values.networkPolicy.enabled }}
# Media Functions exchange media through shared memory, not the network, so
# they need almost no network access at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "mxlfn.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mxlfn.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.metrics.port }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}}
      ports:
        - {port: {{ .Values.metrics.port }}, protocol: TCP}
    {{- end }}
  egress:
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- range .Values.networkPolicy.egress }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .namespace }}}
      ports:
        - {port: {{ .port }}, protocol: TCP}
    {{- end }}
{{- end }}
